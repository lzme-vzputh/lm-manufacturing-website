# Pages CMS: page-by-page editor for LM Manufacturing
media:
  - name: images
    label: Media
    input: public/uploads
    output: /uploads
    rename: safe
    extensions:
      - jpg
      - jpeg
      - png
      - webp
      - avif
  - name: logos
    label: Company logos
    input: public/uploads
    output: /uploads
    rename: safe
    extensions:
      - svg
      - png
      - webp
  - name: fonts
    label: Fonts (.ttf)
    input: public/uploads/fonts
    output: /uploads/fonts
    rename: safe
    extensions:
      - ttf
content:
  - name: companySettings
    label: 1 · Company Settings
    type: group
    items:
      - name: settings
        label: Company Settings · English + Khmer + Shared
        type: file
        path: src/data/site.yml
        fields:
          - name: companyNameEn
            label: Company name — English
            type: string
          - name: companyNameKh
            label: Company name — Khmer
            type: string
          - name: logo
            label: Company logo — shared
            type: image
            options:
              media: logos
              path: public/uploads
              rename: safe
          - name: fontUrl
            label: English font (.ttf) — optional
            type: file
            options:
              media: fonts
              path: public/uploads/fonts
              extensions:
                - ttf
              rename: safe
          - name: fontKhUrl
            label: Khmer font (.ttf) — optional
            type: file
            options:
              media: fonts
              path: public/uploads/fonts
              extensions:
                - ttf
              rename: safe
          - name: descriptionEn
            label: Company description — English
            type: text
          - name: descriptionKh
            label: Company description — Khmer
            type: text
          - name: contact
            label: Contact details — shared and bilingual
            type: object
            fields:
              - name: phone
                label: Phone — shared
                type: string
              - name: email
                label: General email — shared
                type: string
              - name: addressEn
                label: Address — English
                type: text
              - name: addressKh
                label: Address — Khmer
                type: text
              - name: businessHoursEn
                label: Business hours — English
                type: string
              - name: businessHoursKh
                label: Business hours — Khmer
                type: string
              - name: applicationEmail
                label: Job application email — shared
                type: string
          - name: social
            label: Social links — shared
            type: object
            fields:
              - name: facebook
                type: string
              - name: linkedin
                type: string
              - name: telegram
                type: string
              - name: youtube
                type: string
          - name: footer
            label: Footer text — bilingual
            type: object
            fields:
              - name: copyrightEn
                label: Copyright — English
                type: string
              - name: copyrightKh
                label: Copyright — Khmer
                type: string
          - name: seo
            label: Search and sharing — bilingual
            type: object
            fields:
              - name: defaultTitleEn
                label: Default page title — English
                type: string
              - name: defaultTitleKh
                label: Default page title — Khmer
                type: string
              - name: titleTemplateEn
                label: Page title format — English (keep %s)
                type: string
              - name: titleTemplateKh
                label: Page title format — Khmer (keep %s)
                type: string
              - name: defaultDescriptionEn
                label: Search description — English
                type: text
              - name: defaultDescriptionKh
                label: Search description — Khmer
                type: text
              - name: defaultImage
                label: Default sharing image — shared
                type: image
                options:
                  media: images
                  path: public/uploads/home
                  rename: safe
          - name: appearance
            label: Website colors — shared
            type: object
            fields:
              - name: accentColor
                label: Accent color (hex, for example
                type: string
              - name: lightBackground
                label: Light mode page background
                type: string
              - name: lightSurface
                label: Light mode cards and header
                type: string
              - name: lightMuted
                label: Light mode secondary sections
                type: string
              - name: lightText
                label: Light mode main text
                type: string
              - name: darkBackground
                label: Dark mode page background
                type: string
              - name: darkSurface
                label: Dark mode cards and header
                type: string
              - name: darkMuted
                label: Dark mode secondary sections
                type: string
              - name: darkText
                label: Dark mode main text
                type: string
