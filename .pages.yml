# Pages CMS: edit content at https://pagescms.org
media:
- name: images
  label: Media
  input: public/uploads
  output: /uploads
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
- name: logos
  label: Company logos
  input: public/uploads
  output: /uploads
  rename: safe
  extensions:
  - svg
  - png
  - webp
