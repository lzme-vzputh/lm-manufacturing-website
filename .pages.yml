# Pages CMS: edit content at https://pagescms.org
media:
- name: images
  label: Media
  input: public/uploads
  output: /uploads
  rename: safe
  extensions:
  - jpg
  - jpeg
  - png
  - webp
  - avif
- name: logos
  label: Company logos
  input: public/uploads
  output: /uploads
  rename: safe
  extensions:
  - svg
  - png
  - webp
- name: fonts
  label: Fonts (.ttf)
  input: public/uploads/fonts
  output: /uploads/fonts
  rename: safe
  extensions:
  - ttf
content:
- name: english
  label: English + Shared Settings
  type: group
